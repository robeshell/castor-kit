packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.65'
  - '@ai-sdk/gateway@4.0.94'
  - '@ai-sdk/google@4.0.82'
  - '@ai-sdk/openai-compatible@3.0.57'
  - '@ai-sdk/openai@4.0.78'
  - '@ai-sdk/provider-utils@5.0.49'
  - ai@7.0.116
  - '@ai-sdk/mcp@2.0.60'
  - '@ai-sdk/react@4.0.119'

# A few apps/web sources import transitive deps directly (e.g. react-resizable/css pulled in by react-grid-layout).
# npm's flat node_modules resolves them but pnpm's strict layout doesn't, so hoist them here instead of changing the sources.
publicHoistPattern:
  - react-resizable
