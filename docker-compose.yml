# Volume names can be overridden via env vars (database and uploaded files):
#   COMPOSE_DB_VOLUME=<db volume name> COMPOSE_DATA_VOLUME=<data volume name>
services:
  db:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: castor_kit
      POSTGRES_USER: castor_kit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U castor_kit -d castor_kit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # npm mirror for faster installs in mainland China; override with NPM_REGISTRY in .env.production
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://castor_kit:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db/castor_kit
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      # Read-only account password (setup-once uses it to create castor_kit_ro for AI SQL)
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:?POSTGRES_RO_PASSWORD is required}
      # Dedicated read-only connection for AI SQL (must point to the non-superuser read-only account; never fall back to the main superuser)
      AI_SQL_DATABASE_URL: postgresql://castor_kit_ro:${POSTGRES_RO_PASSWORD}@db/castor_kit
      # Scheduled tasks (with multiple replicas, set RUN_SCHEDULER_IN_WEB=false and let a dedicated worker service run them)
      ENABLE_TASK_SCHEDULER: ${ENABLE_TASK_SCHEDULER:-true}
      RUN_SCHEDULER_IN_WEB: ${RUN_SCHEDULER_IN_WEB:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Mail, file storage, uploads and the AI model are configured on the System settings page. Adding a variable here
      # (SMTP_HOST, S3_BUCKET, AI_API_KEY …, see .env.production.example) pins that value instead; empty values don't pin.
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploaded files
      - app_data:/app/data

volumes:
  postgres_data:
    name: ${COMPOSE_DB_VOLUME:-castor-kit_postgres_data}
  app_data:
    name: ${COMPOSE_DATA_VOLUME:-castor-kit_app_data}
