name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/robeshell/castor-kit/issues) first.
        For security problems, follow [SECURITY.md](https://github.com/robeshell/castor-kit/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - API (apps/api)
        - Web UI (apps/web)
        - MCP server (apps/mcp)
        - Scaffold / verify tooling
        - Docker / setup.sh
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, pnpm, PostgreSQL and browser versions; Docker or local setup.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant logs (they will be formatted as code).
      render: shell
